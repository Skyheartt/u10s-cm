name: Refresh leaderboard

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh even if the last file is under 30 minutes old"
        type: boolean
        default: false

concurrency:
  group: refresh-standings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch leaderboards
        env:
          NADEO_LOGIN: ${{ secrets.NADEO_LOGIN }}
          NADEO_PASSWORD: ${{ secrets.NADEO_PASSWORD }}
          TM_CLIENT_ID: ${{ secrets.TM_CLIENT_ID }}
          TM_CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}
          CONTACT: ${{ secrets.CONTACT }}
        run: python scripts/refresh.py ${{ inputs.force && '--force' || '' }}

      - name: Publish the new standings
        run: |
          git config user.name "u10s-cm refresh"
          git config user.email "u10s-cm@users.noreply.github.com"
          git add web/data/standings.json
          if [ -f data/names.json ]; then git add data/names.json; fi
          if [ -f data/maps.json ]; then git add data/maps.json; fi
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "Refresh champion medal standings"
            git push
          fi
