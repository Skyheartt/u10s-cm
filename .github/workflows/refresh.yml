name: Refresh leaderboard

on:
  schedule:
    # Minute 17, not minute 0. GitHub drops queued jobs at the top of the hour.
    - cron: "17 */3 * * *"
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh even if the last file is under 30 minutes old"
        type: boolean
        default: false

concurrency:
  group: refresh-standings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch leaderboards
        env:
          NADEO_LOGIN: ${{ secrets.NADEO_LOGIN }}
          NADEO_PASSWORD: ${{ secrets.NADEO_PASSWORD }}
          TM_CLIENT_ID: ${{ secrets.TM_CLIENT_ID }}
          TM_CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}
          CONTACT: ${{ secrets.CONTACT }}
        run: python scripts/refresh.py ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}

      - name: Publish the new standings
        run: |
          git config user.name "u10s-cm refresh"
          git config user.email "u10s-cm@users.noreply.github.com"
          git add web/data/standings.json
          if [ -f data/names.json ]; then git add data/names.json; fi
          if [ -f data/maps.json ]; then git add data/maps.json; fi
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "Refresh champion medal standings"
            git push origin HEAD:main
          fi

      - name: Ask Cloudflare to publish
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "No CLOUDFLARE_DEPLOY_HOOK secret. The Git push has to trigger the deploy."
          fi
